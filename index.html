<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <h2>Bienvenido a mi Página Web</h2>
        <h3>Inicia Sesión para continuar</h3>
        
        <form action="/login" method="POST" style="display: inline-block; text-align: left;">
            <label>Correo:</label><br>
            <input type="email" name="email" required style="width: 250px; padding: 5px;"><br><br>
            
            <label>Contraseña:</label><br>
            <input type="password" name="password" required style="width: 250px; padding: 5px;"><br><br>
            
            <button type="submit" style="padding: 8px 15px;">Entrar</button>
        </form>
        
        <div style="margin-top: 15px;">
            <a href="bienvenido.html" style="color: #0066cc; text-decoration: none; font-size: 14px;">Ir directo a la pizzería (Sin iniciar sesión)</a>
        </div>

        <hr style="width: 300px; margin: 30px auto;">

        <h3>¿No tienes cuenta? Regístrate</h3>
        <form action="/register" method="POST" style="display: inline-block; text-align: left;">
            <label>Correo:</label><br>
            <input type="email" name="email" required style="width: 250px; padding: 5px;"><br><br>
            
            <label>Contraseña:</label><br>
            <input type="password" name="password" required style="width: 250px; padding: 5px;"><br><br>
            
            <button type="submit" style="padding: 8px 15px;">Registrarse</button>
        </form>
    </div>
</body>
</html>
