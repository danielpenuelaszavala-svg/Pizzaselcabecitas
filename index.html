<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <h2>Bienvenido a mi Página Web</h2>
        <h3>Inicia Sesión para continuar</h3>

        <form id="formularioLogin" action="/login" method="POST" style="display: inline-block; text-align: left;">
            <label>Correo:</label><br>
            <input type="email" name="email" required style="width: 250px; padding: 5px;"><br><br>

            <label>Contraseña:</label><br>
            <input type="password" name="password" required style="width: 250px; padding: 5px;"><br><br>

            <button type="submit" style="padding: 8px 15px;">Entrar</button>
        </form>

        <hr style="width: 300px; margin: 30px auto;">

        <h3>¿No tienes cuenta? Regístrate</h3>
        <form id="formularioRegistro" action="/register" method="POST" style="display: inline-block; text-align: left;">
            <label>Correo:</label><br>
            <input type="email" name="email" required style="width: 250px; padding: 5px;"><br><br>

            <label>Contraseña:</label><br>
            <input type="password" name="password" required style="width: 250px; padding: 5px;"><br><br>

            <button type="submit" style="padding: 8px 15px;">Registrarse</button>
        </form>
    </div>

    <script>
        document.getElementById("formularioRegistro").addEventListener("submit", async function (event) {
            event.preventDefault();
            const email = this.querySelector('input[name="email"]').value.trim();
            const password = this.querySelector('input[name="password"]').value;

            const res = await fetch("/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            alert(data.mensaje);
            if (data.ok) this.reset();
        });

        document.getElementById("formularioLogin").addEventListener("submit", async function (event) {
            event.preventDefault();
            const email = this.querySelector('input[name="email"]').value.trim();
            const password = this.querySelector('input[name="password"]').value;

            const res = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if (!data.ok) {
                alert(data.mensaje || "Datos incorrectos");
                return;
            }

            localStorage.setItem("usuarioCabesita", data.usuario);
            window.location.href = "/bienvenido.html";
        });
    </script>
</body>
</html>
